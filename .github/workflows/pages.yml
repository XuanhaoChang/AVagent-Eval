name: Deploy avagent-eval website

on:
  push:
    branches: [main]
    paths:
      - 'web_app/**'
      - 'av_eval/web_*.py'
      - 'tests/test_web_*.py'
      - 'tests/fixtures/web_runner.py'
      - 'requirements-web.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -p 'test_web_api.py' -v
      - run: python -m unittest discover -s tests -p 'test_web_app.py' -v
      - run: node --check web_app/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web_app
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
