name: Deploy avagent-eval website

on:
  push:
    branches: [main]
    paths:
      - 'web_app/**'
      - 'paper_site/**'
      - 'av_eval/web_*.py'
      - 'tests/test_web_*.py'
      - 'tests/test_web_events.mjs'
      - 'tests/test_web_render.mjs'
      - 'scripts/configure_github_access.py'
      - 'scripts/configure_ngrok_access.py'
      - 'tests/test_configure_github_access.py'
      - 'tests/test_configure_ngrok_access.py'
      - 'tests/fixtures/web_runner.py'
      - 'requirements-web.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-web.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m unittest discover -s tests -p 'test_web_api.py' -v
      - run: python -m unittest discover -s tests -p 'test_web_app.py' -v
      - run: node --check web_app/app.js
      - run: node --test tests/test_web_events.mjs
      - run: node --test tests/test_web_render.mjs
      - run: python -m unittest discover -s tests -p 'test_configure_ngrok_access.py' -v
      - run: python -m unittest discover -s tests -p 'test_configure_github_access.py' -v
      - name: Assemble paper site and existing evaluation app
        run: |
          mkdir -p _site/eval _site/assets
          cp -a web_app/. _site/eval/
          cp -a paper_site/. _site/
          curl --fail --location --retry 3 --max-time 300 \
            https://huggingface.co/datasets/XuanhaoChang/DefectLens-Demo/resolve/43dc2a46a89a677e2f5bfb5b4d8cfdf46b90c20f/defectlens-demo-v3.1.mp4 \
            --output _site/assets/defectlens-demo-v3.1.mp4
          printf '%s  %s\n' '5af84eb9983f26681aead2c34ed7e337f8798a4a8fe0eaa4a86b0c11bf114958' '_site/assets/defectlens-demo-v3.1.mp4' | sha256sum -c -
          curl --fail --location --retry 3 --max-time 120 \
            https://huggingface.co/datasets/XuanhaoChang/DefectLens-Demo/resolve/43dc2a46a89a677e2f5bfb5b4d8cfdf46b90c20f/defectlens-demo-v3-poster.jpg \
            --output _site/assets/defectlens-demo-v3-poster.jpg
          printf '%s  %s\n' '380c594cef081ff0ff0f126042bdc46acaf3324bc41ddf45a44dc2ba34500cd9' '_site/assets/defectlens-demo-v3-poster.jpg' | sha256sum -c -
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
