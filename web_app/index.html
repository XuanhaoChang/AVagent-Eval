<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="avagent-eval — 上传生成视频、文本描述与参考图，检测音视频问题并定位到对应片段。">
  <meta name="referrer" content="no-referrer">
  <title>avagent-eval · 音视频缺陷评测</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260910-evaluate">
  <script src="config.js?v=20260910-evaluate" defer></script>
  <script src="job-events.js?v=20260910-evaluate" defer></script>
  <script src="app.js?v=20260910-evaluate" defer></script>
</head>
<body>
  <a class="skip" href="#main">跳转到评测</a>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">ae</span>avagent<span>-eval</span></a>
    <span class="header-caption">Generated audio-video evaluation</span>
    <div class="header-links"><span id="connection-status" class="status">正在连接…</span><a href="https://github.com/XuanhaoChang/AVagent-Eval" target="_blank" rel="noopener noreferrer">GitHub ↗</a></div>
  </header>
  <main id="main">
    <div class="page-heading"><div><p class="eyebrow">AUDIO–VIDEO EVALUATION</p><h1>音视频缺陷评测</h1><p>上传生成视频，查看检测到的问题及对应片段。</p></div><span class="mode-label">单样本评测 <span>/</span> Text · Ref · AV</span></div>
    <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>
    <button id="retry-connection" class="text-button connection-retry" type="button" hidden>重试连接</button>
    <div class="workspace">
      <section class="panel inputs" aria-labelledby="input-title">
        <div class="panel-heading"><h2 id="input-title"><span class="section-number">01</span>输入条件</h2><span class="muted">INPUT</span></div>
        <form id="evaluation-form">
          <fieldset id="input-fields">
            <label class="field">文本描述 <span class="required">必填</span><textarea id="prompt" name="prompt" rows="6" maxlength="10000" required placeholder="描述预期的人物、动作、台词及约束。例如：参考图中的人物面对镜头说出指定台词，保持服装一致，不添加字幕。"></textarea><small>填写生成时的原始 prompt，有助于检查指令遵循。</small></label>
            <label class="field">参考图 <span class="optional">可选 · 最多 4 张</span><input id="references" name="references" type="file" accept="image/png,image/jpeg,image/webp" multiple><small>PNG / JPG / WebP，每张不超过 10 MiB。</small></label>
            <div id="reference-previews" class="reference-previews" aria-label="已选参考图"></div>
            <label class="field">生成视频 <span class="required">必填</span><input id="video-input" name="video" type="file" accept="video/mp4,video/quicktime,video/webm" required><small>MP4 / MOV / WebM，最长 60 秒，总上传小于 <span id="upload-limit">128</span> MiB。</small></label>
            <figure id="video-figure" hidden><video id="video-preview" controls preload="metadata" playsinline></video><figcaption id="video-caption"></figcaption></figure>
            <div class="submit-row"><button id="run" class="primary" type="submit" disabled>开始评测 <span aria-hidden="true">→</span></button><span id="submit-hint">正在连接服务…</span></div>
          </fieldset>
        </form>
      </section>
      <section class="panel output" aria-labelledby="output-title">
        <div class="panel-heading"><h2 id="output-title"><span class="section-number">02</span>评测结果</h2><div class="result-actions"><button id="cancel" class="text-button" hidden>停止评测</button><button id="download" class="text-button" disabled>下载结果 ↓</button></div></div>
        <div class="run-line"><span id="job-status" class="status">等待提交</span></div>
        <div id="job-updates" class="run-line" hidden><span id="event-status" class="muted" role="status" aria-live="polite"></span><button id="refresh-job" class="text-button" disabled>刷新结果 ↻</button></div>
        <div id="result-metrics" class="metrics" aria-label="本次评测结果" hidden><div><span>检测到的问题</span><strong id="metric-issues">—</strong></div><div><span>评测用时</span><strong id="metric-time">—<small> s</small></strong></div></div>
        <div id="empty-results" class="empty-results"><div class="empty-symbol" aria-hidden="true">[ · ]</div><h3>等待评测</h3><p>填写文本描述并上传视频，点击“开始评测”。</p></div>
        <div id="report" hidden>
          <div class="subheading"><h3>问题明细</h3></div>
          <p id="report-notice" class="result-note" role="status" hidden></p>
          <p id="no-issues" class="empty-note" hidden>本次未检测到问题。</p>
          <div id="issue-list" class="issue-list"></div>
        </div>
      </section>
    </div>
    <footer><span>avagent-eval</span><span>Generated audio-video evaluation</span></footer>
  </main>
</body>
</html>
